[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-generator"
description = "IntentModel in, V-model artifact bundle out: needs, requirements, architecture, item-level specs, test hierarchy, AGENTS.md, build plan, traceability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts @ git+https://github.com/ShyAlon/vmodel-contracts.git@10d9e0c60424d23d6a1bd2724777fa97e35e6583",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/spec_generator/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/spec_generator"]


